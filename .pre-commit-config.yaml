repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  # Runs shfmt from its official image rather than the python wrapper hook: the
  # wrapper installs itself through `uv pip`, which is not available everywhere.
  # This is the same dependency the hadolint hook below already needs.
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        language: docker_image
        entry: mvdan/shfmt:v3.14.0-alpine -i 2 -w
        types: [shell]

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint"]

  # The versions above and the ones in .github/workflows/lint.yml are the same
  # versions on purpose, and Renovate only updates these. Runs whenever either
  # side moves, so its update lands red here instead of quietly in CI.
  - repo: local
    hooks:
      - id: lint-versions
        name: linter versions agree with CI
        language: system
        entry: tests/check-lint-versions.sh
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/lint\.yml)$
