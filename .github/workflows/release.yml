---
name: Release

"on":
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Granted per job rather than here: only `publish` needs to write packages, and
# `verify-published` only needs to read one back.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: zomboid-server-docker
            dockerfile: Dockerfile
          - image: zomboid-server-docker-backup
            dockerfile: Dockerfile.backup
          - image: zomboid-server-docker-exporter
            dockerfile: Dockerfile.exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: scan-target:${{ matrix.image }}

      # No continue-on-error here on purpose: a scanner that is allowed to fail
      # looks exactly the same when it is broken as when it finds nothing.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: scan-target:${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `latest=auto` moves `latest` only when a semver tag is built, which is
          # what the README promises it means. Setting it on every push to main
          # would make it a second name for `edge`.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.version={{tag}}
            org.opencontainers.image.revision={{sha}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The smoke test in test.yml builds its own image. That comes from the same
  # source but is a different build, so without this job nobody ever starts the
  # artefact people actually pull. This one pulls the pushed image by its commit
  # digest tag and runs the same end-to-end check against it.
  verify-published:
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space for the Steam download
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Start the published server image
        env:
          SMOKE_SKIP_BUILD: "true"
          SMOKE_TIMEOUT: "2400"
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          export SMOKE_IMAGE="ghcr.io/${owner}/zomboid-server-docker:sha-${GITHUB_SHA}"
          echo "Verifying ${SMOKE_IMAGE}"
          ./tests/smoke.sh

      - name: Show the server log on failure
        if: failure()
        run: docker ps --all --filter 'name=pz-smoke' --format '{{.Names}}' | xargs -r -I{} docker logs --tail 200 {}
