---
name: Lint

"on":
  push:
    branches: [main]
  pull_request:
  # So it can be run against a branch before opening a pull request.
  workflow_dispatch:

permissions:
  contents: read

# Tool versions are kept identical to .pre-commit-config.yaml on purpose. A
# linter that reports differently locally than in CI turns every finding into an
# argument about which run to believe.
env:
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
  SHFMT_IMAGE: mvdan/shfmt:v3.14.0-alpine
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
  YAMLLINT_VERSION: 1.38.0
  ZIZMOR_VERSION: 1.30.0
  GO_IMAGE: golang:1.27-trixie@sha256:9baa6b4187bbb98d240372a8a235ac0bb6b5ddd52bba1431dc2f7c0705862728

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run shellcheck
        run: |
          find scripts tests -name '*.sh' -print0 \
            | xargs -0 docker run --rm -v "${PWD}:/mnt" "${SHELLCHECK_IMAGE}"

      - name: Check shell formatting
        run: |
          find scripts tests -name '*.sh' -print0 \
            | xargs -0 docker run --rm -v "${PWD}:/mnt" -w /mnt "${SHFMT_IMAGE}" -i 2 -d

      - name: Lint Dockerfiles
        run: |
          for dockerfile in Dockerfile Dockerfile.backup tests/Dockerfile; do
            echo "== ${dockerfile}"
            docker run --rm -i "${HADOLINT_IMAGE}" hadolint - <"${dockerfile}"
          done

      # Run from the same pinned toolchain the release build uses, so a finding
      # here cannot differ from one in the image.
      - name: Check Go formatting and vet
        run: |
          docker run --rm -v "${PWD}/exporter:/src" -w /src "${GO_IMAGE}" \
            sh -c 'test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }; go vet ./...'

      - name: Lint YAML
        run: |
          pipx install "yamllint==${YAMLLINT_VERSION}"
          yamllint -c .yamllint .

      - name: Scan workflows with zizmor
        run: |
          pipx install "zizmor==${ZIZMOR_VERSION}"
          zizmor --persona=regular .github/workflows/
