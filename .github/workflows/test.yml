---
name: Test

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, to catch a Project Zomboid update breaking the image before a
    # deployment does.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run bats unit tests
        run: ./tests/run-unit.sh

      # Cheap, and it covers a gap the image smoke test structurally cannot: that
      # one uses `docker run` on the default bridge and never touches the Compose
      # network the stack actually runs on.
      - name: Check the Compose network can reach the internet
        run: ./tests/compose-network.sh

  # Drives the Compose stack, which is what the documentation tells people to
  # run. The image-level test in tests/smoke.sh covers a different path and runs
  # in the release workflow against the published artefact, so neither is
  # redundant and the 7 GB download happens once per workflow.
  smoke:
    runs-on: ubuntu-latest
    needs: unit
    # The server download is roughly 7 GB on Build 42 and the first boot
    # generates a world before it answers anything.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space for the Steam download
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /usr/local/lib/android "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          df -h /

      - name: Run the stack smoke test
        env:
          STACK_TIMEOUT: "2400"
        run: ./tests/stack-smoke.sh

      - name: Show the logs on failure
        if: failure()
        run: docker compose logs --tail 200 || true
