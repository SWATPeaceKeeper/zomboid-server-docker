---
# Overlay for an existing Prometheus that scrapes over a shared Docker network.
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# The network is external and must already exist. This file does not create it,
# because the monitoring stack owns it:
#
#   docker network create monitoring
#
# Only the exporter joins it. pz-server stays on pz-internal, so RCON and the
# game ports remain unreachable from everything else on the monitoring network -
# which is what docker-compose.yml promises. If you want the JVM metrics, layer
# docker-compose.monitoring-jvm.yml on top and read what it says about the cost.
#
# Nothing is published to the host: Prometheus reaches the exporter over the
# shared network, and nothing else needs to.
#
# Scrape configuration for the Prometheus side:
#
#   scrape_configs:
#     - job_name: project-zomboid
#       static_configs:
#         - targets: ["pz-exporter:9401"]
services:
  pz-exporter:
    networks:
      - pz-internal
      - monitoring

networks:
  monitoring:
    external: true
